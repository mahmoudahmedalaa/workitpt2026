  flutter_pdfview: ^1.3.2
  flutter_rating_bar: ^4.0.1
  flutter_rest_client: ^0.2.9-prerelease
  flutter_secure_storage: ^8.0.0
  flutter_svg: ^2.0.7
  freezed: ^2.3.5
  freezed_annotation: ^2.2.0
  get_it: ^7.6.0
  google_maps_flutter: ^2.2.3
  google_sign_in: ^6.1.5
  image_picker: ^0.8.9
  injectable: ^2.1.2
  intl: ^0.18.0
  json_annotation: ^4.8.0
  master_ui_collection: ^0.2.9
  multi_select_flutter: ^4.1.3
  path_provider: ^2.0.15
  pin_code_fields: ^8.0.1
  place_picker:
    path: ./place_picker-0.10.0
  readmore: ^2.1.0
  salomon_bottom_bar: ^3.3.2
  shared_preferences: ^2.2.0
  shimmer: ^3.0.0
  side_sheet: ^1.0.4
  sign_in_with_apple: ^5.0.0
  sizer: ^2.0.15
  smooth_page_indicator: ^1.1.0
  socket_io_client: ^2.0.3+1
  styled_widget: ^0.4.1
  timeago: ^3.6.0
  timer_count_down: ^2.2.2
  timezone: ^0.9.2
  webview_flutter: ^4.4.2

dev_dependencies:
  auto_route_generator: any
  build_runner: ^2.4.6
  flutter_gen_runner: null
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.2
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.1.6
  json_serializable: null
  jwt_decode: ^0.3.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter_gen:
  integrations:
    flutter_svg: true
  colors:
    inputs:
      - assets/colors/color.xml

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/fonts/manrope/
    - assets/icons/
    #    - assets/icons/app_icons/
    - assets/images/
    - shorebird.yaml

  fonts:
    - family: manrope
      fonts:
        - asset: assets/fonts/manrope/manrope_extralight.ttf
          weight: 100
        - asset: assets/fonts/manrope/manrope_extralight.ttf
          weight: 200
