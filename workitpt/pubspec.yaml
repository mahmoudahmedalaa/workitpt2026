name: workitpt
description: workitpt
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ">=2.19.0-0 <4.0.0"

dependencies:
  auto_route: 7.8.0
  cached_network_image: ^3.2.3
  calendar_view: ^1.0.4
  carousel_slider: ^4.2.1
  connectivity_plus: ^4.0.1
